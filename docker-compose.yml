services:
  db:
    image: postgres:16
    container_name: team-task-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: team_task_manager
    ports:
      - "5432:5432"
    volumes:
      - ttm_pgdata:/var/lib/postgresql/data

volumes:
  ttm_pgdata:
